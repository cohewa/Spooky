<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spooky — See it in action</title>
  <style>
    html { color-scheme: dark; background: #101010; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; color: #fff; }
    main { width: min(100% - 32px, 1200px); padding: 32px 0; }
    h1 { font-size: clamp(26px, 4vw, 42px); margin: 0 0 18px; }
    video { display: block; width: 100%; aspect-ratio: 1280 / 862; background: #000; border-radius: 16px; }
    a { color: #ff8918; }
  </style>
</head>
<body>
  <main>
    <h1>Spooky in action</h1>
    <video controls playsinline preload="metadata" poster="media/spooky-demo-poster.png" aria-label="Spooky screen recording">
      <source src="media/spooky-demo.mp4" type="video/mp4">
      Your browser does not support HTML5 video. <a href="media/spooky-demo.mp4">Download the video</a>.
    </video>
    <p><a href="https://github.com/cohewa/Spooky">← Back to Spooky on GitHub</a></p>
  </main>
</body>
</html>
